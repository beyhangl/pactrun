[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pactrun"
version = "0.1.0"
description = "Behavioral contracts for AI agents — declare session-level cost, tool, and drift limits and enforce them at runtime."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Beyhan Gul" },
]
keywords = ["ai", "agents", "contracts", "guardrails", "safety", "compliance", "drift", "enforcement"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
langchain = ["langchain-core>=0.2"]
gemini = ["google-genai>=1.0"]
litellm = ["litellm>=1.0"]
tiktoken = ["tiktoken>=0.9"]
mcp = ["mcp>=1.10,<3"]
otel = ["opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27", "opentelemetry-semantic-conventions>=0.48b0"]
jsonschema = ["jsonschema>=4.0"]
webhook = ["httpx>=0.24"]
evalcraft = ["evalcraft>=0.1.0"]
all = [
    "openai>=1.0",
    "anthropic>=0.30",
    "langchain-core>=0.2",
    "google-genai>=1.0",
    "litellm>=1.0",
    "tiktoken>=0.9",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-semantic-conventions>=0.48b0",
    "jsonschema>=4.0",
    "httpx>=0.24",
    "evalcraft>=0.1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4,<1",
    "mypy>=1.8,<3",
    "types-PyYAML>=6.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
pactrun = "pactrun.cli.main:cli"

[project.entry-points.pytest11]
pactrun = "pactrun.pytest_plugin.plugin"

[project.urls]
Homepage = "https://github.com/beyhangl/pactrun"
Repository = "https://github.com/beyhangl/pactrun"
Issues = "https://github.com/beyhangl/pactrun/issues"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
# Correctness + import hygiene + modernization. Deliberately not enabling the
# naming (N) and simplification (SIM) families: N818 would rename the
# RetrySignal/FallbackSignal control-flow classes (they are intentionally not
# "*Error"), and SIM117 would collapse the nested `with` blocks that keep the
# recovery tests readable. Revisit if the codebase grows a house style for them.
select = ["E", "F", "I", "W", "UP", "B"]
# Docstring tables and predicate messages are deliberately wide.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests favor terse fixtures and inline lambdas over ceremony. E402 is the
# standard `pytest.importorskip(...)`-before-import pattern for optional deps.
"tests/*" = ["E731", "B007", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
# Not strict yet: the predicate factories return dynamically-attributed closures
# (`check.predicate_name = ...`) that strict mode cannot express without a
# Protocol refactor. This config is the enforced floor — tighten incrementally.
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

# The adapters deliberately monkeypatch third-party SDK methods with wrappers
# whose signatures cannot match the originals; the OTel observer holds spans as
# `Any | None` because the dependency is optional. Both are untypeable by
# construction rather than sloppy.
[[tool.mypy.overrides]]
module = [
    "pactrun.adapters.openai",
    "pactrun.adapters.anthropic",
    "pactrun.adapters.gemini",
    "pactrun.observability.otel",
]
disable_error_code = ["assignment", "union-attr"]

[tool.hatch.build.targets.wheel]
packages = ["pactrun"]
