name: Bug report
description: A predicate, adapter, or recovery action behaves wrongly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this lets something through that a contract should block, it may be a
        **security issue** — please report it privately instead (see the link
        on the previous page).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest contract and event sequence that shows the problem.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: pactrun version
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true
  - type: dropdown
    id: entry
    attributes:
      label: Entry point
      options:
        - pactrun.wrap()
        - An adapter (OpenAI / Anthropic / Gemini / LangChain / LiteLLM)
        - MCP adapter
        - Manual Session / emit_*
        - CLI
        - Other
    validations:
      required: true
